repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-merge-conflict
  - id: check-toml

- repo: local
  hooks:
  - id: taplo-format
    name: Taplo Format
    files: ".*toml"
    language: system
    entry: uvx taplo==0.9.3 format
  - id: taplo-lint
    name: Taplo Lint
    files: ".*toml"
    language: system
    entry: uvx taplo==0.9.3 lint
